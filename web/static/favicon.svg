<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Vibrant Gradients for Trueka Brand -->
    <linearGradient id="trkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="trkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="trkOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="trkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="trkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#trkBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Fun Interlocking Barter Infinity / Dynamic Arrows -->
  <g transform="translate(32,32)">
    <!-- Top Arc (Emerald Green Arrow) -->
    <path d="M -16,-4 A 15 15 0 0 1 12,-12 L 10,-7 L 20,-11 L 18,-21 L 14,-16 A 21 21 0 0 0 -22,-3 Z" 
          fill="url(#trkGreen)" filter="url(#trkGlow)" />

    <!-- Bottom Arc (Vibrant Orange/Coral Arrow) -->
    <path d="M 16,4 A 15 15 0 0 1 -12,12 L -10,7 L -20,11 L -18,21 L -14,16 A 21 21 0 0 0 22,3 Z" 
          fill="url(#trkOrange)" filter="url(#trkGlow)" />

    <!-- Central Playful 'T' in Electric Blue / White with Smile Angle -->
    <circle cx="0" cy="0" r="6.5" fill="url(#trkBlue)" />
    <path d="M -3,-2.5 L 3,-2.5 M 0,-2.5 L 0,3.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Playful Magic Sparkle ✦ Top Right -->
    <path d="M 14,-14 Q 14,-10 18,-10 Q 14,-10 14,-6 Q 14,-10 10,-10 Q 14,-10 14,-14 Z" fill="#fde047" />
  </g>
</svg>
